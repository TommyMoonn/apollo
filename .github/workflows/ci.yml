name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  formatting:
    name: Rust formatting
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
          if ($match.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }

          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --check

  clippy:
    name: Rust Clippy
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
          if ($match.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }

          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component clippy

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-clippy-${{ runner.os }}-

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-tests:
    name: Rust tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
          if ($match.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }

          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-tests-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-tests-${{ runner.os }}-

      - name: Test Rust
        run: cargo test --locked --all-targets

      - name: Test repository PowerShell tooling
        shell: pwsh
        run: pwsh -NoProfile -File .\tests\scripts\run.ps1

      - name: Test PowerShell tooling in a tagged-release environment
        shell: pwsh
        run: |
          # Exercise tag-only fixture isolation before a real release tag is pushed.
          $env:GITHUB_REF_TYPE = 'tag'
          $env:GITHUB_REF_NAME = 'v9.9.9'
          $env:GITHUB_REF = 'refs/tags/v9.9.9'
          pwsh -NoProfile -File .\tests\scripts\run.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
