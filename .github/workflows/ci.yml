name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  formatting:
    name: Rust formatting
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and verify target
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $channelMatches = @(Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$')
          if ($channelMatches.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected a Windows x64 runner, got $env:RUNNER_ARCH."
          }

          $channel = $channelMatches[0].Matches[0].Groups[1].Value
          $toolchain = "${channel}-x86_64-pc-windows-msvc"
          rustup toolchain install $toolchain --profile minimal --component rustfmt
          # Override the file's component list for this job only, not its version.
          $env:RUSTUP_TOOLCHAIN = $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          $version = rustc --version --verbose
          $version
          if ($version -notcontains 'host: x86_64-pc-windows-msvc') {
            throw "Expected the x86_64-pc-windows-msvc Rust host."
          }
          cargo --version
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageVersion)"

      - name: Check formatting
        run: cargo fmt --check

  lint:
    name: Rust Clippy
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and verify target
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $channelMatches = @(Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$')
          if ($channelMatches.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected a Windows x64 runner, got $env:RUNNER_ARCH."
          }

          $channel = $channelMatches[0].Matches[0].Groups[1].Value
          $toolchain = "${channel}-x86_64-pc-windows-msvc"
          rustup toolchain install $toolchain --profile minimal --component clippy
          # Override the file's component list for this job only, not its version.
          $env:RUSTUP_TOOLCHAIN = $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          $version = rustc --version --verbose
          $version
          if ($version -notcontains 'host: x86_64-pc-windows-msvc') {
            throw "Expected the x86_64-pc-windows-msvc Rust host."
          }
          cargo --version
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageVersion)"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: . -> target
          cache-bin: 'false'

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  test-build:
    name: Rust tests and build
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain and verify target
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $channelMatches = @(Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$')
          if ($channelMatches.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }
          if ($env:RUNNER_ARCH -ne 'X64') {
            throw "Expected a Windows x64 runner, got $env:RUNNER_ARCH."
          }

          $channel = $channelMatches[0].Matches[0].Groups[1].Value
          $toolchain = "${channel}-x86_64-pc-windows-msvc"
          rustup toolchain install $toolchain --profile minimal
          # Override the file's component list for this job only, not its version.
          $env:RUSTUP_TOOLCHAIN = $toolchain
          "RUSTUP_TOOLCHAIN=$toolchain" >> $env:GITHUB_ENV
          $version = rustc --version --verbose
          $version
          if ($version -notcontains 'host: x86_64-pc-windows-msvc') {
            throw "Expected the x86_64-pc-windows-msvc Rust host."
          }
          cargo --version
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageVersion)"

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@eedcf2fb1c22f010a0eb66b92f378c110977f266 # v2
        with:
          workspaces: . -> target
          cache-bin: 'false'

      - name: Test Rust
        run: cargo test --locked --all-targets

      - name: Build application
        run: cargo build --locked

  release-metadata:
    name: Release metadata
    runs-on: windows-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Record validation environment
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion.ToString()
          Write-Host "Runner: $env:RUNNER_OS $env:RUNNER_ARCH ($env:ImageVersion)"

      - name: Validate release metadata
        run: pwsh -NoProfile -File scripts/check-release.ps1

  ci-gate:
    name: CI Gate
    needs: [formatting, lint, test-build, release-metadata]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require all validation jobs to succeed
        shell: bash
        env:
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
          RELEASE_METADATA_RESULT: ${{ needs.release-metadata.result }}
        run: |
          set -euo pipefail
          {
            echo '## Required validation'
            echo '| Job | Result |'
            echo '| --- | --- |'
            printf '| Formatting | %s |\n' "${FORMATTING_RESULT:-missing}"
            printf '| Lint | %s |\n' "${LINT_RESULT:-missing}"
            printf '| Test and build | %s |\n' "${TEST_BUILD_RESULT:-missing}"
            printf '| Release metadata | %s |\n' "${RELEASE_METADATA_RESULT:-missing}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "${FORMATTING_RESULT:-}" != success ||
                "${LINT_RESULT:-}" != success ||
                "${TEST_BUILD_RESULT:-}" != success ||
                "${RELEASE_METADATA_RESULT:-}" != success ]]; then
            echo 'One or more required validation jobs did not succeed.' >&2
            exit 1
          fi
