name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  NSIS_VERSION: "3.11"

jobs:
  verify-release:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require successful CI for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_id=""
          for attempt in {1..12}; do
            runs_json=$(gh run list \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --limit 20 \
              --json databaseId,headSha)

            run_id=$(jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last | .databaseId // empty' \
              <<<"$runs_json")

            if [[ -n "$run_id" ]]; then
              break
            fi

            echo "No CI run is visible for $GITHUB_SHA yet; retrying in 10 seconds."
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "No push-triggered CI run was found for tagged commit $GITHUB_SHA." >&2
            echo "Push the release commit to main and wait for CI before creating the tag." >&2
            exit 1
          fi

          echo "Reusing CI run $run_id for tagged commit $GITHUB_SHA."
          gh run watch "$run_id" --exit-status

  build:
    name: Build Windows release assets
    needs: verify-release
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Validate release metadata
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\scripts\check-release.ps1
          --tag "$env:GITHUB_REF_NAME"
          --release-changelog

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
          if ($match.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }

          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --target $env:WINDOWS_TARGET

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.WINDOWS_TARGET }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.WINDOWS_TARGET }}-

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version $env:NSIS_VERSION --yes --no-progress

          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "Pinned NSIS compiler was not found after installation: $makensis"
          }

          $actualVersion = (& $makensis /VERSION).Trim()
          if ($actualVersion -ne "v$env:NSIS_VERSION") {
            throw "Expected NSIS v$env:NSIS_VERSION, found '$actualVersion'."
          }

          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows GUI release
        run: cargo build --locked --release --target ${{ env.WINDOWS_TARGET }}

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\stage-windows-release.ps1 `
            --executable ".\target\$env:WINDOWS_TARGET\release\apollo.exe" `
            --makensis "$env:MAKENSIS_PATH"

          $expected = @(
            'Apollo-Setup-x64.exe',
            'Apollo-windows-x64.zip',
            'SHA256SUMS.txt'
          )
          foreach ($name in $expected) {
            $path = Join-Path 'artifacts/windows' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected staged release asset is missing: $path"
            }
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Apollo-windows-x64
          path: |
            artifacts/windows/Apollo-Setup-x64.exe
            artifacts/windows/Apollo-windows-x64.zip
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

  draft-release:
    name: Create or refresh draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Apollo-windows-x64
          path: release-assets

      - name: Verify staged checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          title="Apollo ${tag}"
          mapfile -t assets < <(find release-assets -maxdepth 1 -type f -print | sort)

          if (( ${#assets[@]} == 0 )); then
            echo "No release assets were downloaded." >&2
            exit 1
          fi

          if release_state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi

            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "$title" \
              --notes ""
          fi
