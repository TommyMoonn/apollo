name: Draft GitHub Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WINDOWS_TARGET: x86_64-pc-windows-msvc
  NSIS_VERSION: "3.11"

jobs:
  verify:
    name: Verify release commit
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag, changelog, and main ancestry
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\check-release.ps1 `
            --tag "$env:GITHUB_REF_NAME" `
            --release-changelog

          git merge-base --is-ancestor "$env:GITHUB_SHA" origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Tagged commit $env:GITHUB_SHA is not contained in main."
          }

  quality:
    name: Quality gate
    needs: verify
    uses: ./.github/workflows/ci.yml

  build:
    name: Build Windows release assets
    needs: quality
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          $match = Select-String -Path rust-toolchain.toml -Pattern '^\s*channel\s*=\s*"([^"]+)"\s*$'
          if ($match.Count -ne 1) {
            throw "Expected exactly one Rust toolchain channel in rust-toolchain.toml."
          }

          $channel = $match.Matches[0].Groups[1].Value
          rustup toolchain install $channel --profile minimal --component rustfmt --component clippy --target $env:WINDOWS_TARGET

      - name: Restore Cargo cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ env.WINDOWS_TARGET }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ env.WINDOWS_TARGET }}-

      - name: Install pinned NSIS compiler
        shell: pwsh
        run: |
          choco install nsis --version $env:NSIS_VERSION --yes --no-progress

          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          if (-not (Test-Path -LiteralPath $makensis -PathType Leaf)) {
            throw "Pinned NSIS compiler was not found after installation: $makensis"
          }

          $actualVersion = (& $makensis /VERSION).Trim()
          if ($actualVersion -ne "v$env:NSIS_VERSION") {
            throw "Expected NSIS v$env:NSIS_VERSION, found '$actualVersion'."
          }

          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows GUI release
        run: cargo build --locked --release --target ${{ env.WINDOWS_TARGET }}

      - name: Stage Windows release assets
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\scripts\stage-windows-release.ps1 `
            --executable ".\target\$env:WINDOWS_TARGET\release\apollo.exe" `
            --makensis "$env:MAKENSIS_PATH"

          $expected = @(
            'Apollo-Setup-x64.exe',
            'Apollo-windows-x64.zip',
            'SHA256SUMS.txt'
          )
          foreach ($name in $expected) {
            $path = Join-Path 'artifacts/windows' $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected staged release asset is missing: $path"
            }
          }

      - name: Upload Windows release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Apollo-windows-x64
          path: |
            artifacts/windows/Apollo-Setup-x64.exe
            artifacts/windows/Apollo-windows-x64.zip
            artifacts/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 3

  draft-release:
    name: Create or refresh draft release
    needs: build
    runs-on: windows-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Apollo-windows-x64
          path: release-assets

      - name: Verify staged checksums
        shell: pwsh
        working-directory: release-assets
        run: |
          $expectedNames = @(
            'Apollo-Setup-x64.exe',
            'Apollo-windows-x64.zip'
          )
          $lines = @(Get-Content -LiteralPath 'SHA256SUMS.txt')
          if ($lines.Count -ne $expectedNames.Count) {
            throw "SHA256SUMS.txt must contain exactly two checksum entries."
          }

          for ($index = 0; $index -lt $expectedNames.Count; $index++) {
            $name = $expectedNames[$index]
            $match = [regex]::Match($lines[$index], '^([0-9a-f]{64})  (.+)$')
            if (-not $match.Success -or $match.Groups[2].Value -cne $name) {
              throw "Unexpected checksum entry at line $($index + 1): $($lines[$index])"
            }

            if (-not (Test-Path -LiteralPath $name -PathType Leaf)) {
              throw "Release asset referenced by checksum is missing: $name"
            }
            $actual = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -cne $match.Groups[1].Value) {
              throw "SHA-256 mismatch for $name."
            }
          }

      - name: Create or refresh draft GitHub Release
        shell: pwsh
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $repository = $env:GITHUB_REPOSITORY

          $releaseJson = gh release view $tag --repo $repository --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Refusing to replace assets on published release '$tag'."
            }
          }
          else {
            gh release create $tag `
              --repo $repository `
              --verify-tag `
              --draft `
              --title "Apollo $tag" `
              --notes ''
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release '$tag'."
            }
          }

          gh release upload $tag `
            'Apollo-Setup-x64.exe' `
            'Apollo-windows-x64.zip' `
            'SHA256SUMS.txt' `
            --repo $repository `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to upload release assets for '$tag'."
          }
