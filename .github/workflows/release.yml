name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag belongs to main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Require successful CI for tagged commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          run_id=""
          for attempt in {1..12}; do
            runs_json=$(gh run list \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --event push \
              --branch main \
              --limit 20 \
              --json databaseId,headSha,headBranch,event)

            run_id=$(jq -r --arg sha "$GITHUB_SHA" \
              '[.[] | select(.headSha == $sha and .headBranch == "main" and .event == "push")] | sort_by(.databaseId) | last | .databaseId // empty' \
              <<<"$runs_json")

            if [[ -n "$run_id" ]]; then
              break
            fi

            echo "No CI run is visible for $GITHUB_SHA yet; retrying in 10 seconds."
            sleep 10
          done

          if [[ -z "$run_id" ]]; then
            echo "No push-triggered CI run was found for tagged commit $GITHUB_SHA." >&2
            echo "Push the release commit to main and wait for CI before creating the tag." >&2
            exit 1
          fi

          echo "Reusing CI run $run_id for tagged commit $GITHUB_SHA."
          gh run watch "$run_id" --exit-status
          jobs=$(gh api "repos/$GH_REPO/actions/runs/$run_id/jobs?per_page=100")
          jq -e '[.jobs[] | select(.name == "CI Gate" and .conclusion == "success")] | length == 1' <<<"$jobs" >/dev/null

  build:
    name: Build and verify Windows release assets
    needs: verify-release
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml
    with:
      sha: ${{ github.sha }}
      validate-source: false
      release-candidate: true

  draft-release:
    name: Create or refresh draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out validated release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Windows release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: release-assets

      - name: Verify staged checksums
        shell: bash
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt

      - name: Create or refresh draft GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          title="Apollo ${tag}"
          # Provenance is internal evidence, never a public download.
          assets=(release-assets/Apollo-Setup-x64.exe release-assets/Apollo-windows-x64.zip release-assets/SHA256SUMS.txt)
          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]] || { echo "Missing public asset: $asset" >&2; exit 1; }
          done

          if release_state=$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$release_state" != "true" ]]; then
              echo "Release $tag is already published; refusing to replace its assets." >&2
              exit 1
            fi

            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" "${assets[@]}" \
              --verify-tag \
              --draft \
              --title "$title" \
              --notes-file "release-notes/${tag}.md"
          fi
