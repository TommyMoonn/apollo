name: Windows Installer Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-validation:
    name: Find trusted CI for selected revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      validate-source: ${{ steps.lookup.outputs.validate-source }}
    steps:
      - name: Reuse exact successful main-push CI when available
        id: lookup
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&status=success&per_page=100")
          ids=$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success") | .id] | .[]' <<<"$runs")
          for id in $ids; do
            jobs=$(gh api "repos/$GH_REPO/actions/runs/$id/jobs?per_page=100")
            if jq -e '[.jobs[] | select(.name == "CI Gate" and .conclusion == "success")] | length == 1' <<<"$jobs" >/dev/null; then
              echo "Reusing successful CI Gate in run $id for $GITHUB_SHA."
              echo 'validate-source=false' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo 'No trusted CI Gate for selected revision; run source checks in packaging.'
          echo 'validate-source=true' >> "$GITHUB_OUTPUT"

  package:
    needs: source-validation
    permissions:
      contents: read
    uses: ./.github/workflows/windows-package.yml
    with:
      sha: ${{ github.sha }}
      validate-source: ${{ needs.source-validation.outputs.validate-source != 'false' }}
      release-candidate: false

  verify:
    needs: package
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/windows-verify.yml
    with:
      sha: ${{ github.sha }}
      version: ${{ needs.package.outputs.version }}
      artifact-id: ${{ needs.package.outputs.artifact-id }}
      build-sha: ${{ needs.package.outputs.sha }}
      build-version: ${{ needs.package.outputs.version }}
      run-id: ${{ needs.package.outputs.run-id }}
      run-attempt: ${{ needs.package.outputs.run-attempt }}
