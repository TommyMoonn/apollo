[package]
name = "apollo"
version = "0.3.1"
edition = "2024"
rust-version = "1.97.1"
description = "A lightweight native desktop media utility."
license = "GPL-3.0-only"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem", "Win32_System_Threading"] }

[build-dependencies]
embed-resource = "3.0.11"
