[package]
name = "apollo"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A lightweight native desktop media utility."
license = "GPL-3.0-only"

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[build-dependencies]
embed-resource = "3.0.11"
