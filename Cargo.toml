[package]
name = "apollo"
version = "0.7.0"
edition = "2024"
rust-version = "1.98.1"
description = "A lightweight native desktop media utility."
license = "GPL-3.0-only"

[dependencies]
async-channel = "2.5.0"
eframe = "0.36.1"
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
raw-window-handle = "0.6.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27.0"

[target.'cfg(windows)'.dependencies]
gpui = { version = "=0.2.2", git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false }
gpui_platform = { version = "=0.1.0", git = "https://github.com/zed-industries/zed", rev = "d01b134cddf5e4f71964deb2d6f81cdb38fcf1e7", default-features = false }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_ColorSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61.2", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3.0.11"
